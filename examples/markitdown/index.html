<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkItDown · HTML 转 Markdown</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e302a;background:#f5f7f2;line-height:1.65}
    *{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:48px 24px}
    .eyebrow{font-size:13px;letter-spacing:.12em;color:#287254;font-weight:700}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:12px 0}
    .intro{color:#55645d;margin-bottom:30px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .panel{background:#fff;border:1px solid #dce4d9;border-radius:16px;padding:22px;min-width:0}
    label,.panel h2{display:block;font-weight:650;font-size:17px;margin:0 0 14px}
    textarea{resize:vertical;width:100%;min-height:320px;padding:14px;border:1px solid #dce4d9;border-radius:9px;font:15px/1.65 ui-monospace,monospace;background:#fafcf8;color:#21372d}
    textarea:focus{outline:2px solid #2a7958;outline-offset:2px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button,.file-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border:1px solid #dce4d9;border-radius:8px;background:white;color:#24543d;font:inherit;cursor:pointer}
    .primary{background:#266d4e;color:white;border-color:#266d4e}button:disabled{opacity:.5;cursor:wait}#file{display:none}
    .note,#status{font-size:14px;color:#607168}#status{min-height:24px;margin-top:18px}footer{margin-top:24px;color:#607168;font-size:13px}
    @media(max-width:700px){main{padding:30px 16px}.workspace{grid-template-columns:1fr}.panel{padding:18px}textarea{font-size:16px;min-height:240px}}
  </style>
</head>
<body><main>
  <p class="eyebrow">MARKITDOWN · 本地试玩</p>
  <h1>把一段网页，变成 Markdown。</h1>
  <p class="intro">粘贴 HTML，或者打开一份 HTML 文件，看看标题、列表和链接会变成什么。</p>
  <div class="workspace">
    <section class="panel"><label for="html-input">输入 HTML</label>
      <textarea id="html-input" spellcheck="false" placeholder="<h1>试试看</h1>"></textarea>
      <div class="actions"><button class="primary" id="convert" type="button">转换成 Markdown</button><button id="sample" type="button">填入示例</button><label class="file-button" for="file">打开 HTML 文件</label><input id="file" type="file" accept=".html,.htm,text/html"></div>
      <p class="note">支持 UTF-8 HTML，最多 200 KB。</p>
    </section>
    <section class="panel"><label for="markdown-output">Markdown 结果</label>
      <textarea id="markdown-output" readonly placeholder="转换结果会出现在这里。"></textarea>
      <div class="actions"><button id="copy" type="button">复制结果</button><button id="download" type="button">下载 .md</button></div>
    </section>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <footer>此样例仅体验 HTML 转换。内容在本机处理，停止试玩后可回收会话；PDF、Office 和 OCR 不在本次试玩范围内。</footer>
</main><script>
  const input=document.getElementById('html-input'),output=document.getElementById('markdown-output'),status=document.getElementById('status');
  document.getElementById('sample').onclick=()=>{input.value='<h1>我的第一次试玩</h1>\n<p>让一段网页变成可以编辑的笔记。</p>\n<ul><li>保留标题</li><li>保留列表</li></ul>\n<p><a href="https://github.com/microsoft/markitdown">查看 MarkItDown</a></p>';status.textContent='示例已填入，可以开始转换。';};
  document.getElementById('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>200000){status.textContent='文件超过 200 KB，请换一份较小的 HTML。';return;}input.value=await file.text();status.textContent='已打开 '+file.name;};
  document.getElementById('convert').onclick=async e=>{const button=e.target;button.disabled=true;status.textContent='正在转换…';try{const response=await fetch('/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:input.value})});const result=await response.json();if(!response.ok)throw Error(result.error);output.value=result.markdown;status.textContent='转换完成。可以复制或下载结果。';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
  document.getElementById('copy').onclick=async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);status.textContent='已复制。';}catch{output.select();status.textContent='请选择并复制结果。';}};
  document.getElementById('download').onclick=()=>{if(!output.value)return;const url=URL.createObjectURL(new Blob([output.value],{type:'text/markdown;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='converted.md';link.click();URL.revokeObjectURL(url);};
</script></body></html>
