<!DOCTYPE html>
<html lang="{{ 'zh-CN' if locale == 'zh' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('meta.title') }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ t('meta.description') }}{% endblock %}">
  {% block canonical %}{% endblock %}
  {% block head %}{% endblock %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">{{ t('brand.name') }} <span class="brand-sub">{{ t('brand.sub') }}</span></a>
      <nav class="site-nav">
        <a href="/">{{ t('nav.today') }}</a>
        <a href="/saved">{{ t('nav.saved') }}</a>
        <a href="/rss.xml">{{ t('nav.rss') }}</a>
        <span class="lang-switch" aria-label="{{ t('lang.switch') }}">
          <a href="{{ lang_url('zh') }}" class="lang-link{% if locale == 'zh' %} active{% endif %}" hreflang="zh-CN">中</a>
          <a href="{{ lang_url('en') }}" class="lang-link{% if locale == 'en' %} active{% endif %}" hreflang="en">EN</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ t('footer.line1') }}</p>
    <p class="muted">{{ t('footer.line2') }}</p>
  </footer>
  <script>window.VR_I18N = {{ js_i18n() | tojson }};</script>
  <script src="/static/app.js" defer></script>
</body>
</html>
